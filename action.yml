name: 'Dependent blocks linter'
description: 'Runs the blockwatch linter to analyze dependent blocks of code'

inputs:
  extensions:
    description: 'Extensions to pass to blockwatch in the format "key1=value1,key2=value2"'
    required: false
    default: ''
  enable:
    description: 'Validators to enable (comma separated)'
    required: false
    default: ''
  disable:
    description: 'Validators to disable (comma separated)'
    required: false
    default: ''
  ignore:
    description: 'Glob patterns for files to ignore (comma separated)'
    required: false
    default: ''
  suppress:
    description: 'Violations to report without failing the run, addressed as FILE[:BLOCK_NAME[:VALIDATOR[:HASH]]] (comma separated), e.g. "docs/cli.md:cli-docs:keep-sorted". The shorter the address, the more it covers'
    required: false
    default: ''
  suppress_from:
    description: 'Extra files to read suppression addresses from (comma separated), e.g. "notes.txt". Every "Blockwatch-suppress: ADDRESS" line in the file suppresses that violation; all other lines are ignored. Read in addition to the commit messages under test, and a pull request description, which are always read'
    required: false
    default: ''
  globs:
    description: 'Glob patterns for files to check (comma separated). They narrow the run: only matching files are checked.'
    required: false
    default: ''
  verbosity:
    description: 'How much to report about what the run checked: "none", "summary" (default) or "full" (JSON).'
    required: false
    default: 'summary'
  format:
    description: 'The format the violations are printed in: "json" (default) or "sarif" (a SARIF 2.1.0 log). Both go to stderr, i.e. the job log.'
    required: false
    default: 'json'
  only_changed:
    description: 'Validate only the blocks the diff touched ("true") instead of every block in the repository ("false", the default). No effect on events that have no diff'
    required: false
    default: 'false'
  annotations:
    description: 'Report each violation as a GitHub annotation ("true", the default), so it appears on the line itself in the pull request and in the check run of the job, on top of the job log. Needs "jq" on the runner'
    required: false
    default: 'true'
  annotations_limit:
    description: 'How many annotations to emit at most (default 50). GitHub renders only a limited number and drops the rest without saying so; the step reports how many it left out'
    required: false
    default: '50'
  summary:
    description: 'Write the violations to the job summary as a table ("true", the default). GitHub does not cap it the way it caps annotations, so it is where a long list stays readable'
    required: false
    default: 'true'
  diff_pathspec:
    description: "Additional git diff pathspecs or options to filter the diff (e.g., ':(exclude).github/' or multiple separated by spaces). Filters which changes the diff reports, not which files are scanned - use 'ignore' for that"
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # The diff commands below name revisions that predate the checkout (a PR
        # base, the tip before a push). A default depth-1 clone contains none of
        # them, and the diff fails to resolve.
        fetch-depth: 0

    - name: Resolve cargo bin directory
      id: cargo-bin
      run: |
        # cargo installs into $CARGO_INSTALL_ROOT/bin, falling back to
        # $CARGO_HOME/bin and then ~/.cargo/bin. That precedence is mirrored here
        # rather than assumed: images that relocate CARGO_HOME (the official
        # `rust` image among them) would otherwise have the cache save and
        # restore a path the binary never occupies, quietly missing every time.
        #
        # The resolved directory has to be writable, and no fallback is offered
        # if it isn't. A fallback would change only this step's idea of the path,
        # not where cargo-binstall actually writes, replacing a clear install
        # failure with a cache that disagrees with reality.
        CARGO_BIN="${CARGO_INSTALL_ROOT:-${CARGO_HOME:-$HOME/.cargo}}/bin"
        # actions/cache expands its `path` entries as globs, where a backslash is
        # an escape character — so a Windows path needs the forward-slash form
        # (C:/Users/...) to survive. Runners without cygpath already report the
        # path in a usable shape, so leaving it untouched is the right fallback.
        if [[ "$RUNNER_OS" == "Windows" ]] && command -v cygpath >/dev/null; then
          CARGO_BIN="$(cygpath -m "$CARGO_BIN")"
        fi
        echo "dir=$CARGO_BIN" >> "$GITHUB_OUTPUT"
        # PATH is set unconditionally, including on a cache hit that skips both
        # install steps. A runner with no preinstalled Rust has never seen this
        # directory, so a restored binary would otherwise be unreachable.
        echo "$CARGO_BIN" >> "$GITHUB_PATH"
      shell: bash

    - name: Set blockwatch version
      id: blockwatch-version
      # The pinned version exists only here. Both the cache key and the install
      # command read this output instead of repeating the literal, so upgrading
      # blockwatch is a one-line edit that cannot leave the two disagreeing —
      # a stale key would serve the old binary under the new version's name.
      run: echo "version=0.5.5" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache blockwatch binary
      id: cache-blockwatch
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.cargo-bin.outputs.dir }}/blockwatch
          ${{ steps.cargo-bin.outputs.dir }}/blockwatch.exe
        # One cache is shared by every runner in a repository, so the key has to
        # name the platform. Without runner.arch, a repository with a mixed fleet
        # lets an arm64 runner restore the x86_64 binary another one saved.
        key: ${{ runner.os }}-${{ runner.arch }}-blockwatch-${{ steps.blockwatch-version.outputs.version }}

    - name: Install cargo-binstall
      if: steps.cache-blockwatch.outputs.cache-hit != 'true'
      uses: cargo-bins/cargo-binstall@v1.22.0
      with:
        # Two independent pins are required. The `uses:` ref above fixes the
        # action and the install script it runs; this input fixes the executable
        # that script downloads. Omitting it is not a looser pin but a different
        # one — the script then pulls from releases/latest, so any new
        # cargo-binstall release reaches every consumer of this action, and only
        # on a cache miss, making the breakage intermittent and hard to trace.
        #
        # Dependabot updates the ref but has no way to see this input, so the two
        # have to be re-synced by hand whenever its grouped PR lands.
        version: 'v1.21.1'

    - name: Install blockwatch
      if: steps.cache-blockwatch.outputs.cache-hit != 'true'
      run: |
        # The `cargo-binstall` executable, not the `cargo binstall` subcommand:
        # the step above installs binstall on its own without a Rust toolchain,
        # so a self-hosted runner may have no `cargo` to dispatch through.
        #
        # --disable-strategies compile bans the source-build fallback. On a
        # target with no prebuilt binary, that fallback invokes `cargo install`
        # and dies on the missing toolchain with "cargo: command not found",
        # which sends the reader after the wrong problem. Refusing to compile
        # names the real one: no binary is published for this platform.
        cargo-binstall --no-confirm --disable-strategies compile "blockwatch@${{ steps.blockwatch-version.outputs.version }}"
      shell: bash

    - name: Run blockwatch on diff
      id: diff
      run: |
        # An array, not a string: an extension mapping or glob containing spaces
        # has to arrive as a single argv entry, and re-splitting a flat string on
        # whitespace would tear it into several.
        BLOCKWATCH_ARGS=()

        # Every list-valued input accepts comma- or newline-separated values,
        # because a YAML block scalar is the readable way to write a long list in
        # a workflow file and a quoted string is the terse one. Both normalize to
        # one flag/value pair per item.
        add_args() {
          local flag="$1"
          local input="$2"
          if [[ -n "$input" ]]; then
            # Newlines become commas so a single split handles both spellings.
            local clean_input="${input//$'\n'/,}"
            IFS=',' read -ra ITEMS <<< "$clean_input"
            for item in "${ITEMS[@]}"; do
              # Items arrive carrying the indentation of a YAML block scalar and
              # whatever spacing followed a comma; blockwatch would read that
              # padding as part of the value.
              item="$(echo "$item" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [[ -n "$item" ]]; then
                if [[ -n "$flag" ]]; then
                  BLOCKWATCH_ARGS+=("$flag" "$item")
                else
                  BLOCKWATCH_ARGS+=("$item")
                fi
              fi
            done
          fi
        }

        # Booleans arrive as strings, since a composite action has no typed
        # inputs, and only the spellings GitHub itself produces are accepted.
        # Anything else is refused rather than read as false: a mistyped value
        # would otherwise turn off reporting, or widen a run to the whole
        # repository, with nothing downstream to report that it had happened.
        parse_bool() {
          local name="$1"
          local value="${2//[$'\n\r\t ']/}"
          case "$value" in
            true|True|TRUE) printf 'true' ;;
            false|False|FALSE|'') printf 'false' ;;
            *) echo "Error: '$name' must be \"true\" or \"false\", got '$value'." >&2; return 1 ;;
          esac
        }

        add_args "-E" "${{ inputs.extensions }}"
        add_args "-e" "${{ inputs.enable }}"
        add_args "-d" "${{ inputs.disable }}"
        add_args "--ignore" "${{ inputs.ignore }}"

        # Each item is the address of a violation to report but not fail on,
        # FILE[:BLOCK_NAME[:VALIDATOR[:HASH]]], with every segment left off the
        # end widening what it covers. Nothing is checked here: blockwatch
        # rejects a malformed address naming the segment at fault, and silently
        # ignores a well-formed one that covers no violation — an address is
        # meant to be copied out of a previous run's diagnostics, so the run
        # that emits it is the one able to say whether it still matches.
        add_args "--suppress" "${{ inputs.suppress }}"

        # The same addresses, read out of a file instead of written here
        # (blockwatch 0.5.4+). Only `Blockwatch-suppress: ADDRESS` lines count
        # and every other line is ignored, so a commit message is valid input
        # and a suppression can travel with the commit that needs it rather than
        # living in the workflow. The two inputs accumulate; neither overrides
        # the other. An unreadable path fails the step, and that is left to
        # blockwatch: a run that quietly skipped its suppression file would fail
        # on the violations instead, pointing at the code rather than the typo.
        add_args "--suppress-from" "${{ inputs.suppress_from }}"

        # The revisions this run spans, resolved once: the suppression sources
        # just below and the diff at the end of the step are scoped by the same
        # pair, so what may suppress a violation and what is checked for one
        # cannot drift apart.
        BEFORE_SHA="${{ github.event.before }}"  # empty unless this is a push
        CURRENT_SHA="${{ github.sha }}"          # = github.event.after on a push
        ZERO_SHA="0000000000000000000000000000000000000000"

        # Suppressions also travel with the work under test rather than only in
        # the workflow file: the commit messages of the commits being checked,
        # and on a pull request its description, are handed to --suppress-from
        # as-is. blockwatch reads `Blockwatch-suppress: ADDRESS` lines out of any
        # text and ignores every other line, so no extraction is needed here.
        # This is additive — `suppress` and `suppress_from` still apply.
        #
        # The range mirrors the diff below exactly, so only the commits whose
        # changes are being checked can suppress anything: a commit elsewhere in
        # the repository cannot reach in and silence a violation.
        AUTO_SUPPRESS_FILE="$(mktemp)"
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # Two dots, not the three the diff uses: this wants the commits the
          # pull request adds, not a patch. The merge commit GitHub checks out
          # is included and harmless, its generated message carrying no address.
          git log --format=%B "origin/${{ github.base_ref }}..$CURRENT_SHA" >> "$AUTO_SUPPRESS_FILE"
          # The description arrives through the environment, never through an
          # expression expansion. It is written by whoever opened the request —
          # a stranger, on a fork — and expanding it inline would paste their
          # text into this script for bash to run.
          printf '%s\n' "$PR_BODY" >> "$AUTO_SUPPRESS_FILE"
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          if [[ "$BEFORE_SHA" == "$ZERO_SHA" ]]; then
            # A new branch has no prior tip to enumerate from, so only the head
            # commit is read — exactly the commit the diff below covers.
            git log -1 --format=%B "$CURRENT_SHA" >> "$AUTO_SUPPRESS_FILE"
          else
            git log --format=%B "$BEFORE_SHA..$CURRENT_SHA" >> "$AUTO_SUPPRESS_FILE"
          fi
        else
          # No push range and no pull request, so the commit being scanned is the
          # only one that can be meant. Reading it keeps a workflow_dispatch
          # re-run of a commit behaving like the push that first checked it.
          git log -1 --format=%B HEAD >> "$AUTO_SUPPRESS_FILE"
        fi
        BLOCKWATCH_ARGS+=("--suppress-from" "$AUTO_SUPPRESS_FILE")

        # A suppression picked up from a commit message changes the exit code
        # without appearing anywhere in the workflow file, so the log is the only
        # place a reader can find out it happened. The pattern mirrors what
        # blockwatch matches (prefix at the start of the line, leading whitespace
        # trimmed, case-insensitive); it only labels the lines, and blockwatch
        # remains the one deciding which of them take effect.
        if FOUND="$(grep -iE '^[[:space:]]*blockwatch-suppress:' "$AUTO_SUPPRESS_FILE")"; then
          echo "Note: suppression addresses found in the commit messages/description under test:"
          echo "$FOUND"
        fi

        # verbosity holds one enum value (none|summary|full) rather than a list,
        # so it does not go through add_args. A comma-separated value there would
        # expand to --verbosity twice, and clap answers a repeated single-value
        # flag by keeping the last occurrence — so a malformed input would be
        # quietly acted on instead of reported.
        #
        # A bare token needs no more normalization than having its whitespace
        # removed. An empty input appends nothing at all, leaving blockwatch on
        # its own default of "none".
        #
        # The level is deliberately not validated here: blockwatch rejects an
        # unknown one and prints the accepted values, which tells the reader more
        # than this step could.
        VERBOSITY="${{ inputs.verbosity }}"
        VERBOSITY="${VERBOSITY//[$'\n\r\t ']/}"
        if [[ -n "$VERBOSITY" ]]; then
          BLOCKWATCH_ARGS+=("--verbosity" "$VERBOSITY")
        fi

        # format (blockwatch 0.5.3+) is a single enum too (json|sarif), and is
        # kept out of add_args for the same reason verbosity is. "sarif" writes a
        # SARIF 2.1.0 log in place of the JSON diagnostics, and writes one even
        # when the run found nothing, since a code-scanning service expects a log
        # from every run. Both formats go to stderr, which this step leaves
        # attached to the job log: uploading the log to code scanning means
        # capturing that stream in the calling workflow, not just setting this.
        #
        # Unknown values are left to blockwatch, which names the accepted ones.
        FORMAT="${{ inputs.format }}"
        FORMAT="${FORMAT//[$'\n\r\t ']/}"
        if [[ -n "$FORMAT" ]]; then
          BLOCKWATCH_ARGS+=("--format" "$FORMAT")
        fi

        # Globs are positional, so they must come last and nothing may be
        # appended after this point. They narrow whichever set of files the run
        # already selected — since blockwatch 0.4.0 a glob can only ever remove
        # files from a run, never add one back that the mode left out.
        add_args "" "${{ inputs.globs }}"

        # Split on whitespace so one input can still carry several pathspecs
        # (":(exclude).github/ :(exclude)docs/"). This was an unquoted expansion
        # repeated at every git call; as an array each item stays one argument,
        # and a pathspec holding a glob now reaches git instead of being matched
        # against the working directory by the shell on the way.
        DIFF_PATHSPEC="${{ inputs.diff_pathspec }}"
        DIFF_PATHSPEC_ITEMS=()
        if [[ -n "$DIFF_PATHSPEC" ]]; then
          read -ra DIFF_PATHSPEC_ITEMS <<< "$DIFF_PATHSPEC"
        fi

        # --diff is what makes blockwatch read the piped diff at all; without it
        # stdin is ignored and the tree is scanned as if nothing had changed.
        # --only-changed then narrows the run from every block in the repository
        # to the ones that diff touched.
        ONLY_CHANGED="$(parse_bool only_changed "${{ inputs.only_changed }}")"
        DIFF_FLAGS=(--diff)
        if [[ "$ONLY_CHANGED" == "true" ]]; then
          DIFF_FLAGS+=(--only-changed)
        fi

        # The reporting inputs are read before anything runs, so a typo fails on
        # its own terms instead of halfway through a lint run.
        ANNOTATIONS="$(parse_bool annotations "${{ inputs.annotations }}")"
        SUMMARY="$(parse_bool summary "${{ inputs.summary }}")"
        ANNOTATIONS_LIMIT="${{ inputs.annotations_limit }}"
        ANNOTATIONS_LIMIT="${ANNOTATIONS_LIMIT//[$'\n\r\t ']/}"
        if [[ -z "$ANNOTATIONS_LIMIT" ]]; then
          ANNOTATIONS_LIMIT=50
        fi
        if ! [[ "$ANNOTATIONS_LIMIT" =~ ^[0-9]+$ ]]; then
          echo "Error: 'annotations_limit' must be a whole number, got '$ANNOTATIONS_LIMIT'." >&2
          exit 1
        fi
        # GitHub rejects a job summary larger than 1 MiB outright, so a
        # repository adopting blockwatch on top of thousands of existing
        # violations would lose the table rather than have it truncated. The
        # rows past this point are counted in a closing line instead.
        SUMMARY_ROW_LIMIT=1000

        # jq reads the diagnostics below. It is present on every GitHub-hosted
        # runner; a self-hosted one without it fails here, naming both ways out,
        # rather than completing with annotations silently missing.
        if [[ "$ANNOTATIONS" == "true" || "$SUMMARY" == "true" ]]; then
          if ! command -v jq >/dev/null 2>&1; then
            echo "Error: 'annotations' and 'summary' need jq to read the blockwatch diagnostics, and it is not on PATH. Install jq on the runner, or set annotations: 'false' and summary: 'false'." >&2
            exit 1
          fi
        fi

        # blockwatch already reports a violation with everything an annotation
        # needs: a path, a 1-based range whose end column is inclusive, the
        # validator that fired, and the address to suppress it by. These filters
        # flatten either output format into one record per violation, so the
        # code reading them is the same for both.
        #
        # Which filter to use is decided by the input rather than by inspecting
        # the document: the JSON diagnostics are keyed by file path, so a
        # repository holding a file named "runs" would read as a SARIF log.
        #
        # Fields are joined on U+001F, not tabs: a tab in IFS is whitespace, and
        # bash folds a run of it into a single separator, so the empty address of
        # an unnamed block would swallow its own field and shift every field
        # after it. Newlines inside a message become U+001E for a related reason
        # — `read` is line-based, and a multi-line message would otherwise
        # arrive as several truncated records.
        JSON_FILTER='
          to_entries[] as $file
          | $file.value[]
          | [ $file.key,
              (.range.start.line // 1),
              (.range.end.line // .range.start.line // 1),
              (.range.start.character // 0),
              (.range.end.character // 0),
              (if (.suppressed // false) then "notice"
               elif (.severity // 1) == 2 then "warning"
               elif (.severity // 1) >= 3 then "notice"
               else "error" end),
              (.code // "blockwatch"),
              (.address // ""),
              ((.suppressed // false) | tostring),
              ((.message // "") | gsub("\r\n"; "\n") | gsub("\n"; "\u001e")) ]
          | map(tostring) | join("\u001f")'
        SARIF_FILTER='
          .runs[]? | .results[]?
          | (.locations[0].physicalLocation // {}) as $location
          | ($location.region // {}) as $region
          | ((((.suppressions // []) | length) > 0)) as $suppressed
          | [ ($location.artifactLocation.uri // ""),
              ($region.startLine // 1),
              ($region.endLine // $region.startLine // 1),
              ($region.startColumn // 0),
              ($region.endColumn // 0),
              (if $suppressed then "notice"
               elif .level == "warning" then "warning"
               elif .level == "note" or .level == "none" then "notice"
               else "error" end),
              (.ruleId // "blockwatch"),
              (.properties.address // ""),
              ($suppressed | tostring),
              ((.message.text // "") | gsub("\r\n"; "\n") | gsub("\n"; "\u001e")) ]
          | map(tostring) | join("\u001f")'

        # A workflow command is delimited text: a raw newline ends it, and a
        # comma or colon inside a property value starts the next property.
        # GitHub's own toolkit percent-encodes exactly these before writing one,
        # and the runner decodes them again on the way in.
        escape_data() {
          local value="${1//%/%25}"
          value="${value//$'\r'/%0D}"
          # The placeholder the filters above folded newlines into.
          value="${value//$'\036'/%0A}"
          printf '%s' "$value"
        }
        escape_property() {
          local value
          value="$(escape_data "$1")"
          value="${value//:/%3A}"
          value="${value//,/%2C}"
          printf '%s' "$value"
        }
        join_with_commas() {
          local IFS=','
          printf '%s' "$*"
        }

        # Reads the captured diagnostics back and reports each violation as an
        # annotation, a job-summary row, or both. Output that is not a parseable
        # document is left alone: a usage error ("diff in stdin is empty.", a
        # malformed suppression address) arrives on the same stream, is already
        # in the log verbatim, and names no line to point at.
        report() {
          if [[ "$ANNOTATIONS" != "true" && "$SUMMARY" != "true" ]]; then
            return 0
          fi
          [[ -s "$DIAG_FILE" ]] || return 0
          jq -e . "$DIAG_FILE" >/dev/null 2>&1 || return 0

          local filter="$JSON_FILTER"
          if [[ "$FORMAT" == "sarif" ]]; then
            filter="$SARIF_FILTER"
          fi

          local total=0 emitted=0 omitted=0 rows=0
          local file start_line end_line start_column end_column level code address suppressed message
          local -a properties
          local body location cell summary_rows
          summary_rows="$(mktemp)"

          while IFS=$'\037' read -r file start_line end_line start_column end_column level code address suppressed message; do
            total=$((total + 1))

            if [[ "$ANNOTATIONS" == "true" ]]; then
              if (( emitted < ANNOTATIONS_LIMIT )); then
                properties=()
                if [[ -n "$file" ]]; then
                  properties+=("file=$(escape_property "$file")" "line=$start_line" "endLine=$end_line")
                  # GitHub renders a column range only within a single line and
                  # ignores one that spans several.
                  if [[ "$start_line" == "$end_line" && "$start_column" != "0" && "$end_column" != "0" ]]; then
                    properties+=("col=$start_column" "endColumn=$end_column")
                  fi
                fi
                properties+=("title=$(escape_property "blockwatch: $code")")
                body="$(escape_data "$message")"
                # The address is what a reader needs in order to act on the
                # annotation, and it appears nowhere else on the line. A
                # violation in an unnamed block has none, so nothing is added.
                if [[ -n "$address" ]]; then
                  body="${body}%0ASuppress with: Blockwatch-suppress: ${address}"
                fi
                echo "::${level} $(join_with_commas "${properties[@]}")::${body}"
                emitted=$((emitted + 1))
              else
                omitted=$((omitted + 1))
              fi
            fi

            if [[ "$SUMMARY" == "true" && $rows -lt $SUMMARY_ROW_LIMIT ]]; then
              location="—"
              if [[ -n "$file" ]]; then
                location="${file}:${start_line}"
              fi
              # Markdown here, not a workflow command: a pipe would end the cell
              # and the newline placeholder has to become a line break.
              cell="${message//|/\|}"
              cell="${cell//$'\036'/<br>}"
              if [[ "$suppressed" == "true" ]]; then
                code="${code} (suppressed)"
              fi
              printf '| `%s` | %s | %s | %s |\n' "$location" "$code" "$cell" "${address:-—}" >> "$summary_rows"
              rows=$((rows + 1))
            fi
          done < <(jq -r "$filter" "$DIAG_FILE")

          if [[ "$ANNOTATIONS" == "true" && $omitted -gt 0 ]]; then
            echo "::notice title=blockwatch::${omitted} further violation(s) were not annotated (annotations_limit=${ANNOTATIONS_LIMIT}). All of them are in the job log above."
          fi

          if [[ "$SUMMARY" == "true" && $total -gt 0 && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              printf '### blockwatch: %s violation(s)\n\n' "$total"
              printf '| Location | Validator | Message | Suppress address |\n'
              printf '| --- | --- | --- | --- |\n'
              cat "$summary_rows"
              if (( total > rows )); then
                printf '\n_%s further violation(s) not listed._\n' "$((total - rows))"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          return 0
        }

        # One command per event, run in a single place below. The six variants
        # this replaced each ended in their own `| blockwatch ...`, and the
        # stderr capture the reporting needs has to happen exactly once.
        DIFF_CMD=()
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # Three dots: diffing against the merge base shows what the pull
          # request itself changed, excluding commits the base branch gained
          # since it forked. Two dots would attribute those to the pull request.
          DIFF_CMD=(git diff --patch "origin/${{ github.base_ref }}...$CURRENT_SHA")

        elif [[ "${{ github.event_name }}" == "push" ]]; then
          # The span the push added: the branch tip beforehand, up to the new
          # one, both resolved above.
          #
          # A push that creates a branch reports an all-zero "before" SHA: there
          # is no prior tip, so the head commit is diffed against the empty tree.
          if [[ "$BEFORE_SHA" == "$ZERO_SHA" ]]; then
            # `git diff-tree`, not `git diff`. --root belongs to diff-tree, and
            # `git diff` accepts it silently rather than rejecting it, then
            # compares the *working tree* against the SHA — on this action's
            # clean checkout an empty patch, letting every validator pass without
            # examining anything.
            #
            # -m --first-parent is load-bearing: diff-tree prints nothing at all
            # for a merge commit unless asked, and a newly pushed branch can
            # perfectly well have a merge at its head.
            #
            # --no-commit-id drops the bare SHA line diff-tree emits ahead of the
            # patch. It is not part of the diff format blockwatch documents as
            # its input, so relying on it being tolerated would be a wager.
            #
            # Only the head commit is covered: a new branch has no base to diff
            # its earlier commits against. Those get checked when it is opened as
            # a pull request.
            DIFF_CMD=(git diff-tree --patch --root -m --first-parent --no-commit-id "$CURRENT_SHA")
          else
            DIFF_CMD=(git diff --patch "$BEFORE_SHA...$CURRENT_SHA")
          fi

        else
          echo "Note: event '${{ github.event_name }}' provides no diff, so the whole repository is scanned. Diff-driven checks (e.g. affects) cannot run, and 'only_changed' does not apply."
        fi

        # `--` keeps git from reading a pathspec as a revision name.
        if [[ ${#DIFF_CMD[@]} -gt 0 && ${#DIFF_PATHSPEC_ITEMS[@]} -gt 0 ]]; then
          DIFF_CMD+=(-- "${DIFF_PATHSPEC_ITEMS[@]}")
        fi

        # stderr is captured rather than streamed straight through, so the
        # diagnostics can be read back as annotations and then replayed to the
        # log unchanged: what a reader could previously copy out of the log is
        # still there, after the run rather than during it.
        DIAG_FILE="$(mktemp)"
        set +e
        if [[ ${#DIFF_CMD[@]} -gt 0 ]]; then
          "${DIFF_CMD[@]}" | blockwatch "${DIFF_FLAGS[@]}" "${BLOCKWATCH_ARGS[@]}" 2>"$DIAG_FILE"
        else
          # Without --diff blockwatch never reads stdin, so there is no
          # descriptor here to block on.
          blockwatch "${BLOCKWATCH_ARGS[@]}" 2>"$DIAG_FILE"
        fi
        # A composite action's bash runs with pipefail, so the pipeline reports
        # the rightmost command that failed. That is blockwatch's own code
        # whenever it ran and failed, which includes the diff git could not
        # produce: an empty stdin is an error it raises itself. A git failure
        # surfaces only when blockwatch nevertheless exited 0.
        STATUS=$?
        set -e
        cat "$DIAG_FILE" >&2

        # Reporting must never decide the outcome: the violations are in the log
        # above either way, so a failure to annotate them is worth a warning and
        # nothing more.
        if ! report; then
          echo "::warning title=blockwatch::Could not turn the blockwatch diagnostics into annotations. They are in the job log above."
        fi

        # blockwatch's exit code is what fails the job. Everything above only
        # changes where the violations are shown.
        exit "$STATUS"
      shell: bash
      env:
        # Passed in rather than expanded into the script, because a pull request
        # description is attacker-controlled text: `${{ github.event.pull_request.body }}`
        # written inline anywhere above would let a body ending in `"; curl ... | sh; #`
        # run commands on the runner. As a variable it is only ever data.
        PR_BODY: ${{ github.event.pull_request.body }}
