name: 'Dependent blocks linter'
description: 'Runs the blockwatch linter to analyze dependent blocks of code'

inputs:
  extensions:
    description: 'Extensions to pass to blockwatch in the format "key1=value1,key2=value2"'
    required: false
    default: ''
  enable:
    description: 'Validators to enable (comma separated)'
    required: false
    default: ''
  disable:
    description: 'Validators to disable (comma separated)'
    required: false
    default: ''
  ignore:
    description: 'Glob patterns for files to ignore (comma separated)'
    required: false
    default: ''
  suppress:
    description: 'Violations to report without failing the run, addressed as FILE[:BLOCK_NAME[:VALIDATOR[:HASH]]] (comma separated), e.g. "docs/cli.md:cli-docs:keep-sorted". The shorter the address, the more it covers'
    required: false
    default: ''
  suppress_from:
    description: 'Extra files to read suppression addresses from (comma separated), e.g. "notes.txt". Every "Blockwatch-suppress: ADDRESS" line in the file suppresses that violation; all other lines are ignored. Read in addition to the commit messages under test, and a pull request description, which are always read'
    required: false
    default: ''
  globs:
    description: 'Glob patterns for files to check (comma separated). They narrow the run: only matching files are checked.'
    required: false
    default: ''
  verbosity:
    description: 'How much to report about what the run checked: "none", "summary" (default) or "full" (JSON).'
    required: false
    default: 'summary'
  format:
    description: 'The format the violations are printed in: "json" (default) or "sarif" (a SARIF 2.1.0 log). Both go to stderr, i.e. the job log.'
    required: false
    default: 'json'
  only_changed:
    description: 'Validate only the blocks the diff touched ("true") instead of every block in the repository ("false", the default). No effect on events that have no diff'
    required: false
    default: 'false'
  annotations:
    description: 'Report each violation as a GitHub annotation ("true", the default), so it appears on the line itself in the pull request and in the check run of the job, on top of the job log. Needs "jq" on the runner'
    required: false
    default: 'true'
  annotations_limit:
    description: 'How many annotations to emit at most (default 50). GitHub renders only a limited number and drops the rest without saying so; the step reports how many it left out'
    required: false
    default: '50'
  summary:
    description: 'Write the violations to the job summary as a table ("true", the default). GitHub does not cap it the way it caps annotations, so it is where a long list stays readable'
    required: false
    default: 'true'
  diff_pathspec:
    description: "Additional git diff pathspecs or options to filter the diff (e.g., ':(exclude).github/' or multiple separated by spaces). Filters which changes the diff reports, not which files are scanned - use 'ignore' for that"
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # The diff commands below name revisions that predate the checkout (a PR
        # base, the tip before a push). A default depth-1 clone contains none of
        # them, and the diff fails to resolve.
        fetch-depth: 0

    - name: Resolve cargo bin directory
      id: cargo-bin
      run: |
        # cargo installs into $CARGO_INSTALL_ROOT/bin, falling back to
        # $CARGO_HOME/bin and then ~/.cargo/bin. That precedence is mirrored here
        # rather than assumed: images that relocate CARGO_HOME (the official
        # `rust` image among them) would otherwise have the cache save and
        # restore a path the binary never occupies, quietly missing every time.
        #
        # The resolved directory has to be writable, and no fallback is offered
        # if it isn't. A fallback would change only this step's idea of the path,
        # not where cargo-binstall actually writes, replacing a clear install
        # failure with a cache that disagrees with reality.
        CARGO_BIN="${CARGO_INSTALL_ROOT:-${CARGO_HOME:-$HOME/.cargo}}/bin"
        # actions/cache expands its `path` entries as globs, where a backslash is
        # an escape character — so a Windows path needs the forward-slash form
        # (C:/Users/...) to survive. Runners without cygpath already report the
        # path in a usable shape, so leaving it untouched is the right fallback.
        if [[ "$RUNNER_OS" == "Windows" ]] && command -v cygpath >/dev/null; then
          CARGO_BIN="$(cygpath -m "$CARGO_BIN")"
        fi
        echo "dir=$CARGO_BIN" >> "$GITHUB_OUTPUT"
        # PATH is set unconditionally, including on a cache hit that skips both
        # install steps. A runner with no preinstalled Rust has never seen this
        # directory, so a restored binary would otherwise be unreachable.
        echo "$CARGO_BIN" >> "$GITHUB_PATH"
      shell: bash

    - name: Set blockwatch version
      id: blockwatch-version
      # The pinned version exists only here. Both the cache key and the install
      # command read this output instead of repeating the literal, so upgrading
      # blockwatch is a one-line edit that cannot leave the two disagreeing —
      # a stale key would serve the old binary under the new version's name.
      run: echo "version=0.6.0" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache blockwatch binary
      id: cache-blockwatch
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.cargo-bin.outputs.dir }}/blockwatch
          ${{ steps.cargo-bin.outputs.dir }}/blockwatch.exe
        # One cache is shared by every runner in a repository, so the key has to
        # name the platform. Without runner.arch, a repository with a mixed fleet
        # lets an arm64 runner restore the x86_64 binary another one saved.
        key: ${{ runner.os }}-${{ runner.arch }}-blockwatch-${{ steps.blockwatch-version.outputs.version }}

    - name: Install cargo-binstall
      if: steps.cache-blockwatch.outputs.cache-hit != 'true'
      uses: cargo-bins/cargo-binstall@v1.22.0
      with:
        # Two independent pins are required. The `uses:` ref above fixes the
        # action and the install script it runs; this input fixes the executable
        # that script downloads. Omitting it is not a looser pin but a different
        # one — the script then pulls from releases/latest, so any new
        # cargo-binstall release reaches every consumer of this action, and only
        # on a cache miss, making the breakage intermittent and hard to trace.
        #
        # Dependabot updates the ref but has no way to see this input, so the two
        # have to be re-synced by hand whenever its grouped PR lands.
        version: 'v1.21.1'

    - name: Install blockwatch
      if: steps.cache-blockwatch.outputs.cache-hit != 'true'
      run: |
        # The `cargo-binstall` executable, not the `cargo binstall` subcommand:
        # the step above installs binstall on its own without a Rust toolchain,
        # so a self-hosted runner may have no `cargo` to dispatch through.
        #
        # --disable-strategies compile bans the source-build fallback. On a
        # target with no prebuilt binary, that fallback invokes `cargo install`
        # and dies on the missing toolchain with "cargo: command not found",
        # which sends the reader after the wrong problem. Refusing to compile
        # names the real one: no binary is published for this platform.
        cargo-binstall --no-confirm --disable-strategies compile "blockwatch@${{ steps.blockwatch-version.outputs.version }}"
      shell: bash

    - name: Run blockwatch on diff
      id: diff
      # The logic lives in scripts/run.py, not here. A `run:` block that embeds
      # ${{ }} expressions is parsed as one GitHub template, and a template caps
      # at 21000 characters — a ceiling this step reached, and one no amount of
      # testing the logic itself would have found, since it fails at parse time.
      # A file is not a template.
      #
      # It also ends the inline expansion of inputs. Every value now arrives as
      # an environment variable, which is data; a `${{ inputs.globs }}` spliced
      # into a shell script is code, and one of these values — the pull request
      # description — is written by whoever opened the request.
      run: |
        # Git Bash on the Windows runners does not always expose `python3`.
        if command -v python3 >/dev/null 2>&1; then
          PYTHON=python3
        else
          PYTHON=python
        fi
        "$PYTHON" "$GITHUB_ACTION_PATH/scripts/run.py"
      shell: bash
      env:
        INPUT_EXTENSIONS: ${{ inputs.extensions }}
        INPUT_ENABLE: ${{ inputs.enable }}
        INPUT_DISABLE: ${{ inputs.disable }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_SUPPRESS: ${{ inputs.suppress }}
        INPUT_SUPPRESS_FROM: ${{ inputs.suppress_from }}
        INPUT_GLOBS: ${{ inputs.globs }}
        INPUT_VERBOSITY: ${{ inputs.verbosity }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_ONLY_CHANGED: ${{ inputs.only_changed }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_ANNOTATIONS_LIMIT: ${{ inputs.annotations_limit }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_DIFF_PATHSPEC: ${{ inputs.diff_pathspec }}
        # Used for one thing only: reading the pull request description as it
        # reads now, rather than as the event payload froze it when the run was
        # created. A fork's token is read-only and a workflow may restrict it
        # further; either way the script falls back to the payload.
        #
        # The description itself is read from GITHUB_EVENT_PATH, so it needs no
        # variable of its own and never passes through an expression.
        GH_TOKEN: ${{ github.token }}
