name: Local Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-action:
    runs-on: ubuntu-latest
    name: Test Action
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Blockwatch Action
        uses: ./
        with:
          # Test various inputs to ensure argument parsing works correctly
          extensions: "rs=cpp"
          enable: "keep-sorted"
          ignore: "target/**"
          globs: "**/*.md"
          
      - name: Run Blockwatch Action (No Args)
        uses: ./

      - name: Run Blockwatch Action (Enable Args)
        uses: ./
        with:
          extensions: |
            rs=cpp
            txt=md
          enable: "keep-sorted,keep-unique"
          ignore: "target/**,dist/**"
          globs: "**/*.md,**/*.yml"

      - name: Run Blockwatch Action (Disable Args)
        uses: ./
        with:
          disable: |
            check-ai
            line-count
          globs: "**/*.md"

      - name: Run Blockwatch Action (Verbosity Summary)
        uses: ./
        with:
          verbosity: "summary"
          globs: "**/*.md"

      - name: Run Blockwatch Action (Verbosity Full)
        uses: ./
        with:
          verbosity: "full"
          globs: "**/*.md"

      - name: Run Blockwatch Action (SARIF Format)
        uses: ./
        with:
          format: "sarif"
          globs: "**/*.md"

      - name: Run Blockwatch Action (Suppress)
        uses: ./
        with:
          suppress: |
            README.md
            action.yml:some-block:keep-sorted
          verbosity: "summary"
          globs: "**/*.md"

      - name: Write a suppression file
        run: |
          printf 'A commit subject\n\nBlockwatch-suppress: README.md\n' > "$RUNNER_TEMP/commit_msg.txt"

      - name: Run Blockwatch Action (Suppress From)
        uses: ./
        with:
          suppress_from: "${{ runner.temp }}/commit_msg.txt"
          verbosity: "summary"
          globs: "**/*.md"

      - name: Run Blockwatch Action (Suppress And Suppress From)
        uses: ./
        with:
          suppress: "action.yml"
          suppress_from: "${{ runner.temp }}/commit_msg.txt"
          verbosity: "summary"
          globs: "**/*.md,**/*.yml"

      - name: Run Blockwatch Action (Only Changed)
        uses: ./
        with:
          only_changed: "true"
          verbosity: "summary"

      # Every case above passes, which is the wrong shape for checking how a
      # violation is reported: a clean run has no diagnostics to annotate. These
      # point the action at a file that violates on purpose. `continue-on-error`
      # keeps the job green while the step still fails, since a reported
      # violation is what is being tested.
      #
      # The fixture's extension is unknown to blockwatch, so the cases above walk
      # past it; `extensions` is what makes it visible here.
      - name: Run Blockwatch Action (Annotations)
        continue-on-error: true
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/*.bwfixture"
          verbosity: "none"

      - name: Run Blockwatch Action (Annotations Off)
        continue-on-error: true
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/*.bwfixture"
          annotations: "false"
          summary: "false"

      - name: Run Blockwatch Action (Annotations Limit)
        continue-on-error: true
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/*.bwfixture"
          annotations_limit: "1"

      - name: Run Blockwatch Action (Annotations From SARIF)
        continue-on-error: true
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/*.bwfixture"
          format: "sarif"

      # A suppressed violation is still reported, so it still gets an annotation
      # - as a notice rather than an error, since it does not fail the run.
      - name: Run Blockwatch Action (Annotations For A Suppressed Violation)
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/*.bwfixture"
          suppress: "testdata/annotations-fixture.bwfixture"
