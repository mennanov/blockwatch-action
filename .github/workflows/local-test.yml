name: Local Test

on:
  # A branch pushed to this repository and then opened as a pull request would
  # otherwise run this workflow twice against the same commit — two check runs,
  # and two of every annotation on the diff. Pushes to main still get a run of
  # their own, and a pull request covers everything else.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-action:
    runs-on: ubuntu-latest
    name: Test Action
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run blockwatch Action
        uses: ./
        with:
          # Test various inputs to ensure argument parsing works correctly
          extensions: "rs=cpp"
          enable: "keep-sorted"
          ignore: "target/**"
          globs: "**/*.md"
          
      - name: Run blockwatch Action (No Args)
        uses: ./

      - name: Run blockwatch Action (Enable Args)
        uses: ./
        with:
          extensions: |
            rs=cpp
            txt=md
          enable: "keep-sorted,keep-unique"
          ignore: "target/**,dist/**"
          globs: "**/*.md,**/*.yml"

      - name: Run blockwatch Action (Disable Args)
        uses: ./
        with:
          disable: |
            check-ai
            line-count
          globs: "**/*.md"

      - name: Run blockwatch Action (Verbosity Summary)
        uses: ./
        with:
          verbosity: "summary"
          globs: "**/*.md"

      - name: Run blockwatch Action (Verbosity Full)
        uses: ./
        with:
          verbosity: "full"
          globs: "**/*.md"

      - name: Run blockwatch Action (SARIF Format)
        uses: ./
        with:
          format: "sarif"
          globs: "**/*.md"

      - name: Run blockwatch Action (Suppress)
        uses: ./
        with:
          suppress: |
            README.md
            action.yml:some-block:keep-sorted
          verbosity: "summary"
          globs: "**/*.md"

      - name: Write a suppression file
        run: |
          printf 'A commit subject\n\nblockwatch-suppress: README.md\n' > "$RUNNER_TEMP/commit_msg.txt"

      - name: Run blockwatch Action (Suppress From)
        uses: ./
        with:
          suppress_from: "${{ runner.temp }}/commit_msg.txt"
          verbosity: "summary"
          globs: "**/*.md"

      - name: Run blockwatch Action (Suppress And Suppress From)
        uses: ./
        with:
          suppress: "action.yml"
          suppress_from: "${{ runner.temp }}/commit_msg.txt"
          verbosity: "summary"
          globs: "**/*.md,**/*.yml"

      - name: Run blockwatch Action (Suppress From Commits And Description Off)
        uses: ./
        with:
          suppress_from_commits: "false"
          suppress_from_description: "false"
          verbosity: "summary"
          globs: "**/*.md"

      # Written outside the checkout: a blockwatch.toml at the repository root
      # would be read by every other case as well.
      - name: Write a config file
        run: |
          printf "ignore = ['target/**']\ndisable = ['check-ai']\n" > "$RUNNER_TEMP/blockwatch.toml"

      - name: Run blockwatch Action (Config)
        uses: ./
        with:
          config: "${{ runner.temp }}/blockwatch.toml"
          verbosity: "summary"
          globs: "**/*.md"

      - name: Run blockwatch Action (Only Changed)
        uses: ./
        with:
          only_changed: "true"
          verbosity: "summary"

      # The fixtures of the annotation cases below hold the only named blocks in
      # the repository, so these two borrow them. Each passes only because its
      # input reached blockwatch: without it, a fixture's keep-sorted violation
      # fails the step. So neither needs continue-on-error, and neither annotates.
      - name: Run blockwatch Action (Skip Blocks)
        uses: ./
        with:
          extensions: "bwfixture=md"
          skip_blocks: |
            testdata/annotations-fixture.bwfixture:out-of-order
            testdata/suppressed-fixture.bwfixture:unsorted
          verbosity: "summary"
          globs: "testdata/*.bwfixture"

      # The listed block is outside `globs`, which is not an error: the address
      # still matches a block on disk, and the fixture the run does see is left
      # with no block to check.
      - name: Run blockwatch Action (Only Blocks)
        uses: ./
        with:
          extensions: "bwfixture=md"
          only_blocks: "testdata/annotations-fixture.bwfixture:out-of-order"
          verbosity: "summary"
          globs: "testdata/suppressed-fixture.bwfixture"

      # Every case above passes, which is the wrong shape for checking how a
      # violation is reported: a clean run has no diagnostics to annotate. These
      # point the action at a file that violates on purpose. `continue-on-error`
      # keeps the job green while the step still fails, since a reported
      # violation is what is being tested.
      #
      # The fixture's extension is unknown to blockwatch, so the cases above walk
      # past it; `extensions` is what makes it visible here.
      # The two cases that annotate get a fixture each: pointed at the same one
      # they put an error and a notice on a single line, which reads as the same
      # violation reported twice. The rest exercise their own input while
      # emitting no file annotation at all.
      - name: Run blockwatch Action (Annotations)
        continue-on-error: true
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/annotations-fixture.bwfixture"
          verbosity: "none"

      - name: Run blockwatch Action (Annotations Off)
        continue-on-error: true
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/*.bwfixture"
          annotations: "false"
          summary: "false"

      # A limit of 0 exercises the cap itself: every violation is counted as
      # omitted, so the step emits the "further violation(s)" notice and not a
      # single file annotation. A limit of 1 against a one-violation fixture
      # would emit the card and never reach the branch being tested.
      - name: Run blockwatch Action (Annotations Limit)
        continue-on-error: true
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/*.bwfixture"
          annotations_limit: "0"

      # The SARIF filter still runs and its output still has to be well formed,
      # but it lands in the job summary rather than as a third identical card.
      - name: Run blockwatch Action (Annotations From SARIF)
        continue-on-error: true
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/*.bwfixture"
          format: "sarif"
          annotations: "false"
          summary: "true"

      # A suppressed violation is still reported, so it still gets an annotation
      # - as a notice rather than an error, since it does not fail the run.
      - name: Run blockwatch Action (Annotations For A Suppressed Violation)
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "testdata/suppressed-fixture.bwfixture"
          suppress: "testdata/suppressed-fixture.bwfixture"
