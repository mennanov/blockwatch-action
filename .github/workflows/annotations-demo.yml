name: Annotations demo

# A throwaway workflow for previewing the annotation UX on a pull request. It is
# meant to FAIL: `demo/` holds blocks that violate on purpose, so the check turns
# red and every violation shows up as an annotation on its own line.
#
# Drop this workflow and the `demo/` directory before merging.
#
# The demo files carry an extension blockwatch does not recognise, so the real
# test workflow walks past them; `extensions` is what makes them visible here,
# and keeps the two workflows from reporting each other's violations.

on:
  # The default activity types, deliberately: `edited` is not among them.
  #
  # Adding `edited` makes a description edit re-run this check, which sounds
  # convenient and is not: the edit does not move the head SHA, so the re-run
  # starts a *second* check run on the same commit, and the Files changed tab
  # overlays the annotations of every check run attached to that SHA. The
  # superseded run's failures then sit on the diff beside the new run's notices,
  # and neither a check run nor its annotations can be deleted through the API.
  #
  # A push moves the SHA, so each commit carries exactly one set of annotations.
  # To try a suppression from the description, edit it and then push anything;
  # to keep it with the work, put it in the commit message instead.
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    name: blockwatch (demo)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run blockwatch on the demo files
        uses: ./
        with:
          extensions: "bwfixture=md"
          globs: "demo/*.bwfixture"
          verbosity: "summary"
