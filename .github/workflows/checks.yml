name: Checks

on:
  # A branch pushed here and then opened as a pull request would otherwise be
  # checked twice against the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Pre-commit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The tests in the pre-commit step below need blockwatch at the version
      # action.yml pins. Running this action installs that version, so it isn't
      # repeated here. The action also checks this repository, and a violation
      # fails the job. Reporting is off so this step adds no annotations.
      - name: Install blockwatch
        uses: ./
        with:
          verbosity: "none"
          annotations: "false"
          summary: "false"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Runs the same three hooks as a local commit, over every file.
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
