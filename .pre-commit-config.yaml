# Formatting, types and tests for the Python in scripts/, before a commit lands.
#
# Install once per clone — pre-commit does not arm itself:
#
#     pipx install pre-commit     # or: brew install pre-commit
#     pre-commit install
#
# `pre-commit run --all-files` checks everything on demand, and
# `git commit --no-verify` bypasses the hooks for one commit.


repos:
  # Black is Python code formatter.
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  # Pyrefly checks Python types.
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.0
    hooks:
      - id: pyrefly-check

  - repo: local
    hooks:
      # `language: system` because these tests run the real blockwatch binary
      # and real git against a throwaway repository; the isolated virtualenv
      # pre-commit would otherwise build has neither. A missing blockwatch, or
      # one other than the version action.yml pins, fails the run with the
      # install command named, rather than skipping. action.yml is among the
      # files so that the commit bumping that version runs them too.
      - id: run-tests
        name: run.py tests
        entry: python3 scripts/run_test.py
        language: system
        files: ^(scripts/.*\.py|action\.yml)$
        pass_filenames: false
